name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version label for manual build artifacts (e.g. 0.7.0)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  # Fast verification gate running once on Linux in parallel with release builds.
  # Keeps Windows/macOS runners dedicated solely to release compilation (avoiding
  # compiling debug + test PDBs + release 3x on every runner).
  verify:
    name: Check & Unit Tests
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check workspace (zero warnings)
        run: cargo check --workspace --all-targets --locked

      - name: Run unit tests
        run: cargo test --workspace --lib --bins --locked

  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: gitfleet-windows-x86_64
            platform: windows
            inno_arch: x64compatible
          - label: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_name: gitfleet-windows-arm64
            platform: windows
            inno_arch: arm64
          - label: macOS Apple Silicon (arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: gitfleet-macos-arm64
            platform: macos
          - label: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: gitfleet-linux-x86_64
            platform: linux
            deb_arch: amd64
            arch_pkg_arch: x86_64
          - label: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: gitfleet-linux-arm64
            platform: linux
            deb_arch: arm64
            arch_pkg_arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Exclude Cargo & workspace from Windows Defender
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup" -ErrorAction Stop
            Write-Host "Added Windows Defender exclusions for faster Rust builds."
          } catch {
            Write-Host "Skipping Defender exclusions: $_"
          }

      - name: Install Linux GUI system libraries & packaging tools
        if: matrix.platform == 'linux'
        run: |
          grep -Rq 'universe' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig1-dev \
            libssl-dev \
            libarchive-tools \
            zstd \
            fakeroot \
            pacman-package-manager \
            makepkg

      - name: Install Rust toolchain & target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build release binary
        id: build
        shell: bash
        run: |
          set -euo pipefail
          HOST=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          if [ "$HOST" = "${{ matrix.target }}" ]; then
            echo "Native build ($HOST) — omitting --target to avoid compiling proc-macros twice"
            cargo build --release --locked -p gitfleet-ui
            echo "bin_dir=target/release" >> "$GITHUB_OUTPUT"
          else
            echo "Cross build ($HOST -> ${{ matrix.target }})"
            cargo build --release --locked --target "${{ matrix.target }}" -p gitfleet-ui
            echo "bin_dir=target/${{ matrix.target }}/release" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Windows (.zip + Setup Installer .exe)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ steps.meta.outputs.version }}"
          $binDir = "${{ steps.build.outputs.bin_dir }}"
          $exePath = (Resolve-Path "$binDir\gitfleet.exe").Path
          $stage = "dist\stage"
          New-Item -ItemType Directory -Force -Path $stage, "dist\out" | Out-Null
          $outDir = (Resolve-Path "dist\out").Path

          # 1. Portable .zip archive
          Copy-Item $exePath "$stage\gitfleet.exe"
          Copy-Item "README.md" "$stage\README.md"
          Copy-Item "LICENSE" "$stage\LICENSE"
          Compress-Archive -Path "$stage\*" -DestinationPath "$outDir\${{ matrix.artifact_name }}.zip" -Force

          # 2. Windows Setup Installer (.exe) via Inno Setup 6
          $isccCandidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              Write-Host "Installing Inno Setup 6 via Chocolatey..."
              choco install innosetup -y --no-progress
            } elseif (Get-Command winget -ErrorAction SilentlyContinue) {
              Write-Host "Installing Inno Setup 6 via winget..."
              winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
            }
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) could not be found."
          }

          & $iscc `
            "/DMyAppVersion=$ver" `
            "/DMyExePath=$exePath" `
            "/DMyArch=${{ matrix.inno_arch }}" `
            "/DMyOutputDir=$outDir" `
            "/DMyOutputName=${{ matrix.artifact_name }}-setup" `
            "packaging\windows\gitfleet.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe failed with exit code $LASTEXITCODE"
          }

      - name: Package macOS (.app + .dmg)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          BIN_DIR="${{ steps.build.outputs.bin_dir }}"
          APP_DIR="dist/dmg/GitFleet.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources" dist/out
          cp "${BIN_DIR}/gitfleet" "$APP_DIR/Contents/MacOS/gitfleet"
          chmod +x "$APP_DIR/Contents/MacOS/gitfleet"

          ICONSET="dist/AppIcon.iconset"
          mkdir -p "$ICONSET"
          for sz in 16 32 128 256 512; do
            sips -z "$sz" "$sz" assets/icon.png --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null
            sz2=$((sz * 2))
            if [ "$sz2" -le 512 ]; then
              sips -z "$sz2" "$sz2" assets/icon.png --out "$ICONSET/icon_${sz}x${sz}@2x.png" >/dev/null
            fi
          done
          iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/AppIcon.icns"

          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>GitFleet</string>
            <key>CFBundleDisplayName</key>
            <string>GitFleet</string>
            <key>CFBundleIdentifier</key>
            <string>org.gitfleet.desktop</string>
            <key>CFBundleVersion</key>
            <string>${VER}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VER}</string>
            <key>CFBundleExecutable</key>
            <string>gitfleet</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc sign bundle so Apple Silicon macOS launches GitFleet.app cleanly
          codesign --force --deep --sign - "$APP_DIR"

          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname "GitFleet" \
            -srcfolder dist/dmg \
            -ov \
            -format UDZO \
            "dist/out/${{ matrix.artifact_name }}.dmg"

      - name: Package Linux (.tar.gz + .deb + pacman .pkg.tar.zst)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          BIN_DIR="${{ steps.build.outputs.bin_dir }}"
          mkdir -p "dist/tar/${{ matrix.artifact_name }}" dist/out

          cp "${BIN_DIR}/gitfleet" "dist/tar/${{ matrix.artifact_name }}/gitfleet"
          chmod +x "dist/tar/${{ matrix.artifact_name }}/gitfleet"
          cp README.md LICENSE assets/icon.png packaging/linux/gitfleet.desktop "dist/tar/${{ matrix.artifact_name }}/"

          tar -C dist/tar -czf "dist/out/${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"

          # Build Debian/Ubuntu .deb package
          DEB_ROOT="dist/deb"
          mkdir -p "$DEB_ROOT/DEBIAN" "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share/applications" "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps"
          cp "${BIN_DIR}/gitfleet" "$DEB_ROOT/usr/bin/gitfleet"
          chmod 755 "$DEB_ROOT/usr/bin/gitfleet"
          cp packaging/linux/gitfleet.desktop "$DEB_ROOT/usr/share/applications/gitfleet.desktop"
          cp assets/icon.png "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps/gitfleet.png"

          cat > "$DEB_ROOT/DEBIAN/control" <<EOF
          Package: gitfleet
          Version: ${VER}
          Section: vcs
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: git, libxkbcommon0, libfontconfig1
          Maintainer: GitFleet Contributors
          Description: Pure-Rust multi-repository Git desktop workspace manager
          EOF

          dpkg-deb --build "$DEB_ROOT" "dist/out/${{ matrix.artifact_name }}.deb"

          # Build Arch Linux / pacman package (.pkg.tar.zst) and pacman repo DB (.db / .files)
          bash packaging/arch/build-pacman-pkg.sh \
            --version "${VER}" \
            --arch "${{ matrix.arch_pkg_arch }}" \
            --binary "${BIN_DIR}/gitfleet" \
            --desktop packaging/linux/gitfleet.desktop \
            --icon assets/icon.png \
            --license LICENSE \
            --readme README.md \
            --out-dir dist/out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/out/*

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-files
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-files/*
