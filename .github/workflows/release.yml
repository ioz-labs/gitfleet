name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version label for manual build artifacts (e.g. 0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Build & Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: gitfleet-windows-x86_64
            platform: windows
            run_tests: true
          - label: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_name: gitfleet-windows-arm64
            platform: windows
            run_tests: true
          - label: macOS Apple Silicon (arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: gitfleet-macos-arm64
            platform: macos
            run_tests: true
          - label: macOS Intel (x86_64)
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: gitfleet-macos-x86_64
            platform: macos
            run_tests: false
          - label: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: gitfleet-linux-x86_64
            platform: linux
            deb_arch: amd64
            run_tests: true
          - label: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: gitfleet-linux-arm64
            platform: linux
            deb_arch: arm64
            run_tests: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Install Linux GUI system libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust toolchain & target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Check workspace (zero warnings)
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

      - name: Run unit tests
        if: matrix.run_tests
        run: cargo test --workspace --lib --bins --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p gitfleet-ui

      - name: Package Windows (.zip)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $stage = "dist\stage"
          New-Item -ItemType Directory -Force -Path $stage, "dist\out" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\gitfleet.exe" "$stage\gitfleet.exe"
          Copy-Item "README.md" "$stage\README.md"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\out\${{ matrix.artifact_name }}.zip" -Force

      - name: Package macOS (.app + .dmg)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          APP_DIR="dist/dmg/GitFleet.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources" dist/out
          cp "target/${{ matrix.target }}/release/gitfleet" "$APP_DIR/Contents/MacOS/gitfleet"
          chmod +x "$APP_DIR/Contents/MacOS/gitfleet"

          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>GitFleet</string>
            <key>CFBundleDisplayName</key>
            <string>GitFleet</string>
            <key>CFBundleIdentifier</key>
            <string>org.gitfleet.desktop</string>
            <key>CFBundleVersion</key>
            <string>${VER}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VER}</string>
            <key>CFBundleExecutable</key>
            <string>gitfleet</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc sign bundle so Apple Silicon macOS launches GitFleet.app cleanly
          codesign --force --deep --sign - "$APP_DIR"

          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname "GitFleet" \
            -srcfolder dist/dmg \
            -ov \
            -format UDZO \
            "dist/out/${{ matrix.artifact_name }}.dmg"

      - name: Package Linux (.tar.gz + .deb)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          mkdir -p "dist/tar/${{ matrix.artifact_name }}" dist/out

          cp "target/${{ matrix.target }}/release/gitfleet" "dist/tar/${{ matrix.artifact_name }}/gitfleet"
          chmod +x "dist/tar/${{ matrix.artifact_name }}/gitfleet"
          cp README.md "dist/tar/${{ matrix.artifact_name }}/README.md"

          cat > "dist/tar/${{ matrix.artifact_name }}/gitfleet.desktop" <<'EOF'
          [Desktop Entry]
          Name=GitFleet
          Comment=Pure-Rust multi-repository Git desktop workspace manager
          Exec=gitfleet
          Terminal=false
          Type=Application
          Categories=Development;RevisionControl;
          EOF

          tar -C dist/tar -czf "dist/out/${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"

          # Build Debian/Ubuntu .deb package
          DEB_ROOT="dist/deb"
          mkdir -p "$DEB_ROOT/DEBIAN" "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share/applications"
          cp "target/${{ matrix.target }}/release/gitfleet" "$DEB_ROOT/usr/bin/gitfleet"
          chmod 755 "$DEB_ROOT/usr/bin/gitfleet"
          cp "dist/tar/${{ matrix.artifact_name }}/gitfleet.desktop" "$DEB_ROOT/usr/share/applications/gitfleet.desktop"

          cat > "$DEB_ROOT/DEBIAN/control" <<EOF
          Package: gitfleet
          Version: ${VER}
          Section: vcs
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: git, libxkbcommon0, libfontconfig1
          Maintainer: GitFleet Contributors
          Description: Pure-Rust multi-repository Git desktop workspace manager
          EOF

          dpkg-deb --build "$DEB_ROOT" "dist/out/${{ matrix.artifact_name }}.deb"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/out/*

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-files
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-files/*
