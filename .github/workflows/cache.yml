name: Warm Cargo Cache

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - ".github/workflows/cache.yml"
  schedule:
    # Touch caches every 5 days so GitHub's 7-day unused-cache TTL never evicts them
    # and automatically re-warm if Rust stable or dependencies changed.
    - cron: "0 3 */5 * *"
  workflow_dispatch:

concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: Warm Verify Cache (Linux)
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install Linux GUI system libraries
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Check workspace & run unit tests
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          cargo check --workspace --all-targets --locked
          cargo test --workspace --lib --bins --locked

  build:
    name: Warm Release Cache (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - label: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
          - label: macOS Apple Silicon (arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
          - label: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
          - label: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain & target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Exclude Cargo & workspace from Windows Defender
        if: matrix.platform == 'windows' && steps.rust-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup" -ErrorAction Stop
            Write-Host "Added Windows Defender exclusions for faster Rust builds."
          } catch {
            Write-Host "Skipping Defender exclusions: $_"
          }

      - name: Install Linux GUI system libraries
        if: matrix.platform == 'linux' && steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Warm release build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          HOST=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          if [ "$HOST" = "${{ matrix.target }}" ]; then
            echo "Native build ($HOST) — omitting --target to avoid compiling proc-macros twice"
            cargo build --release --locked -p gitfleet-ui
          else
            echo "Cross build ($HOST -> ${{ matrix.target }})"
            cargo build --release --locked --target "${{ matrix.target }}" -p gitfleet-ui
          fi
